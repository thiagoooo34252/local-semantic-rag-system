[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "local-semantic-rag-system"
version = "0.1.0"
description = "Sistema RAG local con LangChain, ChromaDB y OpenAI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "langchain-chroma>=1.0,<2",
    "langchain-core>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langchain-text-splitters>=1.0,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "tiktoken>=0.12,<1",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "pyright>=1.1.408,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
]

[tool.setuptools]
py-modules = ["chat", "ingest", "models", "rag", "settings"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["chat", "ingest", "models", "rag", "settings"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.pyright]
include = ["chat.py", "ingest.py", "models.py", "rag.py", "settings.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnusedImport = "error"
reportUnusedVariable = "error"
